name: Release

# Al crear una etiqueta v* (p. ej. v0.1.0): construye la imagen única, le pasa la prueba de humo
# y la publica en GHCR con la versión y `latest`; luego crea el release de GitHub con las notas
# de CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  imagen:
    name: Imagen (build, prueba de humo y publicación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Construir y probar (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chatiapp:release
      - name: Prueba de humo
        run: sh scripts/smoke-image.sh chatiapp:release
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jmmana/chatiapp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publicar (amd64 y arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release de GitHub
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notas desde CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md no tiene la sección [$version]"; exit 1; }
      - name: Crear el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "ChatIApp $GITHUB_REF_NAME" --notes-file notes.md $flags
