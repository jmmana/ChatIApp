name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Para relanzar el CI a mano sobre una rama.
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detectar componentes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
      embed: ${{ steps.d.outputs.embed }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          for c in backend:backend/pyproject.toml frontend:frontend/package.json embed:embed/package.json; do
            name="${c%%:*}"; file="${c#*:}"
            if [ -f "$file" ]; then echo "$name=true" >> "$GITHUB_OUTPUT"; else echo "$name=false" >> "$GITHUB_OUTPUT"; fi
          done

  backend:
    name: Backend (ruff, mypy, pytest)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dependencias (uv.lock al día)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy app
      - name: Pruebas
        run: uv run pytest
      - name: Evaluación del motor con planes grabados (100 %)
        run: uv run python -m app.eval.recorded

  node:
    name: ${{ matrix.package }} (lint, test, build)
    needs: detect
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, embed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: ¿Existe el paquete?
        id: exists
        working-directory: .
        run: |
          if [ "${{ matrix.package }}" = "frontend" ]; then echo "run=${{ needs.detect.outputs.frontend }}" >> "$GITHUB_OUTPUT"; else echo "run=${{ needs.detect.outputs.embed }}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.exists.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.run == 'true'
        with:
          node-version: 22
      - name: pnpm
        if: steps.exists.outputs.run == 'true'
        id: pnpm
        run: |
          corepack enable && pnpm --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Caché de pnpm
        if: steps.exists.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', matrix.package)) }}
          restore-keys: pnpm-${{ runner.os }}-${{ matrix.package }}-
      - name: Dependencias
        if: steps.exists.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.exists.outputs.run == 'true'
        run: pnpm run lint
      - name: Pruebas
        if: steps.exists.outputs.run == 'true'
        run: pnpm run test
      - name: Build
        if: steps.exists.outputs.run == 'true'
        run: pnpm run build
      - name: Navegador para E2E
        if: steps.exists.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E de Playwright
        if: steps.exists.outputs.run == 'true'
        run: pnpm run test:e2e

  imagen:
    name: Imagen única (build y prueba de humo)
    needs: detect
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chatiapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo
        run: sh scripts/smoke-image.sh chatiapp:ci

  helm:
    name: Helm (lint e instalación en kind)
    needs: detect
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint deploy/helm/chatiapp --set existingSecret=chatiapp-secrets
          helm template chatiapp deploy/helm/chatiapp --set existingSecret=chatiapp-secrets >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chatiapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
      - name: Instalar el chart en kind
        run: |
          kind load docker-image chatiapp:ci --name chart-testing
          kubectl create secret generic chatiapp-secrets \
            --from-literal=CHATIAPP_SECRET_KEY="$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            --from-literal=ANTHROPIC_API_KEY=sk-ant-clave-falsa-de-prueba \
            --from-literal=VENTAS_DB_URL=postgresql://usuario:clave@postgres.invalido:5432/ventas \
            --from-literal=CHATIAPP_ADMIN_EMAIL=admin@example.com \
            --from-literal=CHATIAPP_ADMIN_PASSWORD=una-clave-larga-de-prueba
          helm install chatiapp deploy/helm/chatiapp \
            --set image.repository=chatiapp --set image.tag=ci --set image.pullPolicy=Never \
            --wait --timeout 3m
      - name: Probar /api/v1/health
        run: |
          kubectl port-forward svc/chatiapp 8080:8080 &
          for i in $(seq 1 20); do curl -fs http://localhost:8080/api/v1/health && exit 0; sleep 2; done
          kubectl describe pods; kubectl logs deploy/chatiapp || true
          exit 1
      - name: Diagnóstico del pod
        if: failure()
        run: |
          kubectl get pods,pvc -o wide
          kubectl describe pods
          kubectl logs deploy/chatiapp --all-containers --tail=80 || true
          kubectl get events --sort-by=.lastTimestamp | tail -20

  openapi:
    name: Contrato OpenAPI (publicado y sin cambios incompatibles)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dependencias
        run: uv sync --locked
        working-directory: backend
      - name: El archivo publicado coincide con la API
        run: uv run python -m app.api.openapi --check
        working-directory: backend
      - name: Cambios incompatibles frente a main
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if ! git show origin/main:docs/openapi/v1.json > /tmp/base.json 2>/dev/null; then
            echo "main aún no publica docs/openapi/v1.json: no hay nada que comparar"; exit 0
          fi
          BREAKING=""
          docker run --rm -v "$PWD:/w" -v /tmp:/t tufin/oasdiff breaking /t/base.json /w/docs/openapi/v1.json --fail-on ERR > /tmp/diff.txt || BREAKING=1
          cat /tmp/diff.txt
          if [ -n "$BREAKING" ]; then
            echo "$LABELS" | grep -q 'api:cambio-incompatible' || { echo "Cambio incompatible sin la etiqueta api:cambio-incompatible"; exit 1; }
            git diff origin/main -- CHANGELOG.md | grep -q '^+' || { echo "Falta una entrada en CHANGELOG.md"; exit 1; }
          fi

  ok:
    name: CI completo
    needs: [backend, node, imagen, helm, openapi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        run: |
          echo "backend=${{ needs.backend.result }} node=${{ needs.node.result }} imagen=${{ needs.imagen.result }} helm=${{ needs.helm.result }} openapi=${{ needs.openapi.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
