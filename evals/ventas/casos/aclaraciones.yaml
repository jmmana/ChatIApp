# Casos donde el agente debe preguntar antes de responder, y su respuesta.
# Formato: evals/README.md. Los SQL son escritos a mano; los valores esperados
# viven en ../valores.json (se generan con `python -m app.eval.golden --congelar`).

- id: acl-es-sin-periodo
  lang: es
  question: "¿Cuánto vendí?"
  tags: [aclaracion, periodo-faltante]
  expect_clarification:
    slot: period

