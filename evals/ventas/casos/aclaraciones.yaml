- id: acl-es-resp-periodo-mes
  lang: es
  question: "¿Cuánto vendí?"
  answers: ["Este mes"]
  tags: [aclaracion, respuesta, periodo-faltante]
  expect:
    sql: "SELECT SUM(f.total) AS ventas_netas FROM facturas f WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-11-01' AND f.fecha < '2026-12-01'"

- id: acl-es-resp-periodo-30
  lang: es
  question: "¿Cuánto vendí?"
  answers: ["Últimos 30 días"]
  tags: [aclaracion, respuesta, periodo-faltante]
  expect:
    sql: "SELECT SUM(f.total) AS ventas_netas FROM facturas f WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-10-27' AND f.fecha < '2026-11-26'"

- id: acl-es-resp-periodo-facturas
  lang: es
  question: "¿Cuántas facturas tuvimos?"
  answers: ["Mes pasado"]
  tags: [aclaracion, respuesta, periodo-faltante]
  expect:
    sql: "SELECT COUNT(*) AS num_facturas FROM facturas f WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-10-01' AND f.fecha < '2026-11-01'"

- id: acl-es-resp-metrica
  lang: es
  question: "¿Cuánto facturé el mes pasado?"
  answers: ["Ventas sin IVA"]
  tags: [aclaracion, respuesta, metrica-ambigua]
  expect:
    sql: "SELECT SUM(f.subtotal) AS ventas_sin_iva FROM facturas f WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-10-01' AND f.fecha < '2026-11-01'"

- id: acl-es-resp-bogota-juntas
  lang: es
  question: "Ventas del mes pasado en Bogotá"
  answers: ["Las 3 juntas"]
  tags: [aclaracion, respuesta, entidad-ambigua]
  expect:
    sql: "SELECT SUM(f.total) AS ventas_netas FROM facturas f JOIN sucursales s ON s.id = f.sucursal_id WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-10-01' AND f.fecha < '2026-11-01' AND s.ciudad = 'Bogotá'"

- id: acl-es-resp-bogota-una
  lang: es
  question: "Ventas del mes pasado en Bogotá"
  answers: ["Bogotá Unicentro"]
  tags: [aclaracion, respuesta, entidad-ambigua]
  expect:
    sql: "SELECT SUM(f.total) AS ventas_netas FROM facturas f JOIN sucursales s ON s.id = f.sucursal_id WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-10-01' AND f.fecha < '2026-11-01' AND s.nombre = 'Bogotá Unicentro'"

