# Métricas con filtros sobre dimensiones.
# Formato: evals/README.md. Los SQL son escritos a mano; los valores esperados
# viven en ../valores.json (se generan con `python -m app.eval.golden --congelar`).

- id: fil-es-online
  lang: es
  question: "Ventas online este mes"
  tags: [filtro, canal]
  expect:
    sql: "SELECT SUM(f.total) AS ventas_netas FROM facturas f WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-11-01' AND f.fecha < '2026-12-01' AND f.canal = 'ONLINE'"

- id: fil-es-medellin
  lang: es
  question: "¿Cuánto vendimos en Medellín el mes pasado?"
  tags: [filtro, ciudad]
  expect:
    sql: "SELECT SUM(f.total) AS ventas_netas FROM facturas f JOIN sucursales s ON s.id = f.sucursal_id WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-10-01' AND f.fecha < '2026-11-01' AND s.ciudad = 'Medellín'"

