# Expresiones de período de la tabla del resolutor (docs/FLUJO_CONVERSACIONAL.md). Hoy = 2026-11-25.
# Formato: evals/README.md. Los SQL son escritos a mano; los valores esperados
# viven en ../valores.json (se generan con `python -m app.eval.golden --congelar`).

- id: per-es-hoy
  lang: es
  question: "¿Cuánto vendí hoy?"
  tags: [periodo, periodo:hoy]
  expect:
    sql: "SELECT SUM(f.total) AS ventas_netas FROM facturas f WHERE f.estado = 'PAGADA' AND f.fecha >= '2026-11-25' AND f.fecha < '2026-11-26'"

