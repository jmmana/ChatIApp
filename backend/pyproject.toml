[project]
name = "chatiapp-backend"
version = "0.1.0"
description = "Backend de ChatIApp: chat en lenguaje natural sobre bases de datos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "sqlglot>=30.35",
    "litellm>=1.111",
    "cryptography>=43",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "openpyxl>=3.1",
    "sqlguardllm>=0.1.0a1,<0.2",
]

[project.scripts]
chatiapp = "app.cli:main"

# Drivers de bases de datos: se instala solo lo que se usa (docs/BASES_DE_DATOS.md).
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
sqlserver = ["pyodbc>=5.1"]
mysql = ["pymysql>=1.1"]
oracle = ["oracledb>=2.4"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
bigquery = ["sqlalchemy-bigquery>=1.11"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
