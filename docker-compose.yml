# ChatIApp en una sola imagen (docs/adr/0008-imagen-unica-con-sqlite.md).
#
#   docker compose up --build                       → http://localhost:8080
#   docker compose --profile local-ai up --build    → + Ollama para modelos locales
#   docker compose --profile postgres up --build    → + PostgreSQL como base de la app
#                                                     (define CHATIAPP_DATABASE_URL y
#                                                      CHATIAPP_DB_PASSWORD en .env)
#   docker compose --profile observability up       → + colector OpenTelemetry y Jaeger
#                                                     (http://localhost:16686). Define en .env
#                                                      CHATIAPP_OTEL_ENDPOINT=http://otel-collector:4318
#                                                     para que la app exporte las trazas.
#   docker compose --profile integracion up --build → + app anfitriona de ejemplo con el chat
#                                                     embebido (http://localhost:8000)
name: chatiapp

services:
  chatiapp:
    build: .
    image: chatiapp:local
    ports:
      - "${CHATIAPP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - chatiapp-data:/data
      - ${CHATIAPP_CONFIG_DIR:-./examples}:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatiapp
      # Sin contraseña, PostgreSQL no arranca: defínela en .env.
      POSTGRES_PASSWORD: ${CHATIAPP_DB_PASSWORD:-}
      POSTGRES_DB: chatiapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatiapp -d chatiapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${CHATIAPP_JAEGER_PORT:-16686}:16686"
    restart: unless-stopped

  # App anfitriona de ejemplo (examples/integracion/README.md): http://localhost:8000
  integracion-preparar:
    profiles: ["integracion"]
    image: chatiapp:local
    command: ["sh", "/ejemplo/preparar.sh"]
    environment:
      HOST_ORIGIN: http://localhost:${INTEGRACION_PORT:-8000}
    env_file:
      - path: .env
        required: false
    volumes:
      - chatiapp-data:/data
      - ./examples/integracion:/ejemplo:ro
    depends_on:
      chatiapp:
        condition: service_healthy

  integracion:
    profiles: ["integracion"]
    build: ./examples/integracion
    ports:
      - "${INTEGRACION_PORT:-8000}:8000"
    environment:
      CHATIAPP_URL: http://chatiapp:8080
      CHATIAPP_PUBLIC_URL: http://localhost:${CHATIAPP_PORT:-8080}
      HOST_ORIGIN: http://localhost:${INTEGRACION_PORT:-8000}
      CHATIAPP_API_KEY_FILE: /chatiapp/integracion/api_key
      CHATIAPP_DATASOURCE_FILE: /chatiapp/integracion/datasource
    volumes:
      - chatiapp-data:/chatiapp:ro
    depends_on:
      integracion-preparar:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  chatiapp-data:
  postgres-data:
  ollama-data:
